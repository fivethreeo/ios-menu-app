name: MenuApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MenuApp:
    type: application
    platform: iOS
    sources:
      - MenuApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MenuApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Menu
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  MenuAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MenuAppTests
    dependencies:
      - target: MenuApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MenuApp:
    build:
      targets:
        MenuApp: all
    test:
      targets:
        - MenuAppTests
