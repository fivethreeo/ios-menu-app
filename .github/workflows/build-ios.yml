name: Build iOS IPA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Generate Xcode project
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodebuild -version
          xcodegen generate

      - name: Select an available iPhone simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json
          import os

          with open(os.path.join(os.environ["RUNNER_TEMP"], "simulators.json")) as file:
              devices = json.load(file)["devices"]
          iphones = [
              device
              for runtime, entries in devices.items()
              if ".iOS-" in runtime
              for device in entries
              if device["isAvailable"] and device["name"].startswith("iPhone")
          ]
          if not iphones:
              raise SystemExit("No available iPhone simulator found")
          with open(os.environ["GITHUB_ENV"], "a") as file:
              file.write(f"SIMULATOR_ID={iphones[0]['udid']}\n")
          PY

      - name: Run tests
        run: |
          xcodebuild test \
            -project MenuApp.xcodeproj \
            -scheme MenuApp \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/simulator \
            -resultBundlePath build/MenuAppTests.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned iPhone app
        run: |
          xcodebuild build \
            -project MenuApp.xcodeproj \
            -scheme MenuApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/device/Build/Products/Release-iphoneos/MenuApp.app build/ipa/Payload/
          cd build/ipa
          zip -r ../MenuApp-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v7.0.2
        with:
          name: MenuApp-IPA
          path: build/MenuApp-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: MenuApp-TestResults
          path: build/MenuAppTests.xcresult
          if-no-files-found: ignore
          retention-days: 7
